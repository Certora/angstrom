{
	"assert_autofinder_success": true,
	"files": [
		"certora/harnesses/PoolUpdatesHarness.sol",
		"certora/harnesses/PoolManagerHarness.sol",
	],
	"global_timeout": "7200",
	"smt_timeout" : "6000",
	"loop_iter": "2",
	"msg": "Growth Inside Unchanged when Current Tick Moves, loop_iter = 4",
	"rule": "growthInsideUnchangedInTickMove",
	"rule_sanity" : "basic",
	"optimistic_hashing": true,
	"optimistic_loop": true,
	"packages": [
		"forge-std=contracts/lib/forge-std/src",
		"openzeppelin-contracts=contracts/lib/openzeppelin-contracts",
		"solady=contracts/lib/solady",
		"solmate=contracts/lib/solmate",
		"super-sol=contracts/lib/super-sol/src",
		"transient-goodies=contracts/lib/transient-goodies/src",
		"v4-periphery=contracts/lib/v4-periphery",
		"solady/src=contracts/lib/solady/src",
		"v4-core/src=contracts/lib/v4-periphery/lib/v4-core/src",
		"v4-periphery/src=contracts/lib/v4-periphery/src",
		"core/src=contracts/src"
	],
	"optimistic_summary_recursion": true,
	"summary_recursion_limit": "2",
	"process": "emv",
	"prover_args": [
		"-copyLoopUnroll 14",
	],
	"solc_optimize": "1000000",
	"solc_via_ir": true, // to avoid stack too deep issues, not used originally!
	"verify": "PoolUpdatesHarness:certora/specs/PoolRewardsProperties.spec",
	"auto_dispatcher":true,
}